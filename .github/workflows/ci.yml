name: CI

# Сборка и статические проверки для Windows-кода приложения.
# Функциональные наборы (npm run checks) сюда не входят: они открывают окна
# Electron и требуют интерактивной сессии — на hosted-раннерах это нестабильно.
# Публикация docs/ живёт в отдельном workflow (pages.yml).

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# Только чтение: CI ничего не публикует и не пишет в репозиторий, поэтому
# токен не должен уметь больше.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Мажорные теги, а не 40-символьный SHA: пиновка по SHA — следующий шаг,
      # здесь её не сделать без сети (сверить SHA коммитов нечем).
      # TODO: заменить @v4 на @<sha> и добавить строку "# vX.Y.Z" в комментарий.
      - uses: actions/checkout@v4
        with:
          # Креденшелы в .git/config не нужны: дальше никто не пушит.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Версия и ссылка на архив в docs/index.html не должны расходиться с
      # package.json: --check — это dry-run без записи, расхождение = код 1.
      # Релизного архива в CI нет, поэтому размер сверяется только при его
      # наличии (см. предупреждение в выводе шага).
      - name: Site release check (docs/index.html vs package.json)
        run: node scripts/sync-site-release.js --check

      # npm ci вместо npm install: lock-файл обязателен, дерево зависимостей
      # должно совпадать с локальным.
      - name: Install dependencies
        run: npm ci

      # Оба конфига: tsconfig.json (renderer) и tsconfig.electron.json (main).
      - name: Typecheck (renderer + main)
        run: npm run typecheck

      # build:vite отдельным шагом, а не через npm run build: prebuild-хук
      # собирает иконку через PowerShell, а она нужна только релизной сборке.
      - name: Build renderer
        run: npm run build:vite

      - name: Build main process
        run: npm run build:electron

      - name: Build check scripts
        run: npm run checks:build

      # Сборка не должна оставлять изменений в рабочем дереве: иначе
      # незамеченный правленый артефакт (dist-electron, .checks.lock,
      # сгенерированный файл) уедет в следующий коммит.
      - name: Verify clean worktree after build
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::Сборка изменила рабочее дерево (список выше)"
            exit 1
          fi
